name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle test assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk ADders-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ADders-apk
          path: ADders/ADders-v1.apk
