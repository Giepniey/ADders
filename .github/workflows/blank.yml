name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADders/ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle test lint

  build-android:
    needs: test-android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADders/ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk ADders-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ADders-Android-APK
          path: ADders/ADders/ADders-v1.apk

  test-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Package Unit Tests
        run: cd ios/ADdersPlayer && swift test

