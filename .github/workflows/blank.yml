name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADders/ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle test lint

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADders/ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk ADders-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ADders-apk
          path: ADders/ADders-v1.apk

  # Low-cost emulator matrix for manual verification
  emulator-test:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [21, 26, 30, 34, 35]
    defaults:
      run:
        working-directory: ADders/ADders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            ./gradlew connectedDebugAndroidTest || true
            # Manual verification checklist:
            # - App launches without crash
            # - Notification access can be granted
            # - Volume slider works
            # - Auto-switch toggles correctly
